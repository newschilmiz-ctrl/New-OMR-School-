name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the built APK'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "C=US, O=Android, CN=Android Debug"
            echo "Generated fallback debug.keystore"
          fi

      - name: Prepare Environment File
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Build Debug APK with Gradle
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/OMR-Scanner-debug.apk
          ls -lh app/build/outputs/apk/debug/

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OMR-Scanner-APK
          path: app/build/outputs/apk/debug/OMR-Scanner-debug.apk
          retention-days: 90
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: "OMR Scanner APK Build #${{ github.run_number }}"
          body: |
            ### OMR Scanner & Coaching Management Android APK
            - **Build Number:** #${{ github.run_number }}
            - **Commit:** `${{ github.sha }}`
            - Download and install `OMR-Scanner-debug.apk` on your Android device.
          files: app/build/outputs/apk/debug/OMR-Scanner-debug.apk
          draft: false
          prerelease: false
